name: Naver Blog Auto Poster

on:
  schedule:
    # 매일 한국시간 오전 10시(UTC 01:00)와 오후 5시(UTC 08:00) 실행
    - cron: '0 1,8 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  post-to-naver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 크롬 및 크롬 드라이버 설치 (Headless 셀레니움용)
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@latest
    - name: Setup ChromeDriver
      uses: nanasess/setup-chromedriver@master

    - name: 필요한 패키지 설치
      run: |
        sudo apt-get update
        sudo apt-get install -y xclip xvfb
        pip install -r requirements.txt

    - name: 네이버 자동 포스팅 스크립트 실행
      env:
        NAVER_ID: ${{ secrets.NAVER_ID }}
        NAVER_PW: ${{ secrets.NAVER_PW }}
        NID_AUT: ${{ secrets.NID_AUT }}
        NID_SES: ${{ secrets.NID_SES }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_ACTIONS: "true"
      run: |
        xvfb-run -a python -u main.py --mode publish-approval --count 1

    - name: 변경된 원고 상태 커밋 및 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add posts_queue/
        git commit -m "Auto-published a post and updated queue" || echo "No changes to commit"
        git push

    - name: 에러 스크린샷 및 소스코드 업로드
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-logs
        path: |
          error_screenshot.png
          error_page.html
